<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings – NextStep</title>
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="loading-screen.css" type="text/css"/>
<link rel="stylesheet" href="back-to-top.css" type="text/css"/>
<script src="back-to-top.js"></script>
    <script src="loading-screen.js"></script>
    <link rel="stylesheet" href="cookie-consent.css" type="text/css"/>
<script src="cookie-consent.js"></script>
    <link rel="stylesheet" href="scroll-progress.css" type="text/css"/>
    <script src="scroll-progress.js"></script>
    <link rel="stylesheet" href="announcement-banner.css" type="text/css"/>
    <script src="announcement-banner.js"></script>
</head>
<body>

<div class="settings-container">
    <div class="settings-card">

        <h1>Settings</h1>

        <!-- Update Name -->
        <div class="settings-section">
            <h2>Update Display Name</h2>
            <input id="new-name" type="text" placeholder="Enter new display name">
            <button onclick="updateName()">Update Name</button>
        </div>

        <!-- Update Profile Photo -->
        <div class="settings-section">
            <h2>Update Profile Photo</h2>
            <input id="new-photo" type="file" accept="image/*">
            <button onclick="updatePhoto()">Upload Photo</button>
        </div>

        <!-- Change password -->
        <div class="settings-section">
            <h2>Change Password</h2>
            <input id="new-password" type="password" placeholder="New password (6+ chars)">
            <button onclick="changePassword()">Update Password</button>
        </div>

        <!-- Logout -->
        <button class="logout-button" onclick="logout()">Logout</button>

    </div>
</div>

<script type="module" src="settings.js"></script>
<!-- Firebase Auth with Profile Dropdown -->
<script type="module" src="auth-check.js"></script>
<script src="mobile-nav.js"></script>
  <script src="navbar.js"></script>
  <script type="module" src="auth-navbar.js"></script>
    
</body>
</html>
